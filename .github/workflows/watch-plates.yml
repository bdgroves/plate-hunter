name: Watch for new plates

# Once a week, look at each licensing agency's plate page. If plate pictures were added
# or removed, open an issue listing them (or add a comment to the open one).
on:
  schedule:
    - cron: "17 15 * * 1"   # Mondays, ~8 a.m. Pacific
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: watch-plates
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the agency pages
        run: python tools/watch_plates.py --report report.md
      - name: Open or update the issue
        if: hashFiles('report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create new-plates --color F5C518 --description "Plate pages changed" 2>/dev/null || true
          num=$(gh issue list --label new-plates --state open --json number --jq '.[0].number')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body-file report.md
          else
            gh issue create --title "New plates to check ($(date +%Y-%m-%d))" --label new-plates --body-file report.md
          fi
      - name: Save the page lists
        run: |
          git config user.name "plate-hunter-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data/watch
          git add -A data/watch
          if ! git diff --cached --quiet; then
            git commit -m "chore: plate pages checked [skip ci]"
            git pull --rebase -q && git push
          fi
