name: Validate plate data

on:
  push:
    paths: ["data/**", "plates/**", "sw.js", "tools/validate.py"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate.py
