<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔍 Plate Hunter — Washington</title>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--y:#f5c518;--o:#f07d18;--g:#2db37a;--bg:#0d1b2e;--card:#162640;--txt:#f0f4ff;--mut:#6b8aab;--bdr:rgba(255,255,255,.07);--drawer:#0a1e38}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;bottom:0;left:0;right:0;height:50px;background:#1a1a1a;z-index:0;pointer-events:none}
body::after{content:'';position:fixed;bottom:16px;left:0;right:0;height:7px;background:repeating-linear-gradient(90deg,var(--y) 0 50px,transparent 50px 100px);z-index:1;animation:road .5s linear infinite;pointer-events:none}
@keyframes road{to{transform:translateX(-100px)}}
header{background:linear-gradient(160deg,#0a3a68,#1a6fb5);padding:14px 16px 16px;text-align:center;border-bottom:4px solid var(--y);box-shadow:0 4px 24px rgba(0,0,0,.5);position:sticky;top:0;z-index:100}
.title{font-family:'Boogaloo',cursive;font-size:2.2rem;color:var(--y);letter-spacing:3px;text-shadow:3px 3px 0 rgba(0,0,0,.3);line-height:1}
.sub{font-size:.7rem;font-weight:800;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.7);margin-top:3px}
.pw{background:var(--card);padding:11px 15px 9px;border-bottom:1px solid var(--bdr)}
.pr{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.pl{font-size:.7rem;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut)}
.pn{font-family:'Boogaloo',cursive;font-size:1.25rem;color:var(--y)}
.pt{height:12px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden}
.pf{height:100%;background:linear-gradient(90deg,var(--g),#a3e635);border-radius:99px;transition:width .5s cubic-bezier(.34,1.56,.64,1)}
.st{display:flex;gap:8px;margin-top:7px;flex-wrap:wrap}
.pill{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);border-radius:99px;padding:3px 10px;font-size:.71rem;font-weight:800;color:var(--y)}
.pill span{color:var(--mut);font-weight:600}
.fb{padding:9px 11px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:rgba(10,18,30,.9);border-bottom:1px solid var(--bdr);position:sticky;top:83px;z-index:99;backdrop-filter:blur(8px)}
.fb::-webkit-scrollbar{display:none}
.ch{flex-shrink:0;background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.1);border-radius:99px;padding:5px 12px;font-family:'Nunito',sans-serif;font-size:.71rem;font-weight:800;color:var(--mut);cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;-webkit-tap-highlight-color:transparent}
.ch:hover{border-color:rgba(245,197,24,.5);color:var(--txt)}
.ch.on{background:var(--y);border-color:var(--y);color:#111}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(152px,1fr));gap:12px;padding:14px 12px 92px}
.card{background:var(--card);border-radius:14px;overflow:hidden;cursor:pointer;border:2px solid var(--bdr);transition:transform .15s,box-shadow .15s,border-color .2s;position:relative;-webkit-tap-highlight-color:transparent;user-select:none}
.card:hover{transform:translateY(-3px) scale(1.025);box-shadow:0 8px 30px rgba(0,0,0,.5)}
.card:active{transform:scale(.95)}
.card.found{border-color:var(--g);box-shadow:0 0 20px rgba(45,179,122,.3)}
.iw{padding:9px 9px 3px;position:relative;background:rgba(0,0,0,.15);min-height:78px;display:flex;align-items:center;justify-content:center}
.plate-img{width:100%;height:74px;object-fit:contain;display:block;border-radius:5px;transition:filter .3s,opacity .3s}
.card:not(.found) .plate-img{filter:grayscale(90%) brightness(.45);opacity:.7}
.chk{position:absolute;top:5px;right:5px;width:24px;height:24px;background:var(--g);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:0;transform:scale(0);transition:all .3s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 8px rgba(45,179,122,.6);z-index:2}
.card.found .chk{opacity:1;transform:scale(1)}
.info-btn{position:absolute;bottom:5px;right:5px;width:20px;height:20px;background:rgba(255,255,255,.15);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:rgba(255,255,255,.6);cursor:pointer;z-index:3;transition:background .15s}
.info-btn:hover{background:rgba(255,255,255,.3)}
.ci{padding:6px 9px 9px}
.cn{font-size:.73rem;font-weight:800;color:var(--txt);line-height:1.25;margin-bottom:4px}
.cm{display:flex;align-items:center;justify-content:space-between}
.rar{font-size:.59rem;font-weight:900;letter-spacing:.3px;text-transform:uppercase;padding:2px 6px;border-radius:99px}
.r-common{background:rgba(107,138,171,.18);color:#8aaec8}
.r-uncommon{background:rgba(45,179,122,.18);color:var(--g)}
.r-rare{background:rgba(240,125,24,.18);color:var(--o)}
.r-legendary{background:linear-gradient(135deg,rgba(245,197,24,.25),rgba(139,92,246,.25));color:var(--y);animation:glow 2s ease infinite}
@keyframes glow{0%,100%{box-shadow:0 0 3px rgba(245,197,24,.3)}50%{box-shadow:0 0 10px rgba(245,197,24,.8)}}
.pts{font-size:.64rem;font-weight:800;color:var(--y)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.09)}65%{transform:scale(.97)}100%{transform:scale(1)}}
.pop{animation:pop .35s ease}
.burst{position:fixed;pointer-events:none;z-index:9999}
.bit{position:absolute;border-radius:2px;animation:fly .75s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--tx),var(--ty)) rotate(var(--tr));opacity:0}}
.toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%) translateY(16px);background:#0d2240;border:2px solid var(--g);border-radius:99px;padding:9px 20px;font-size:.85rem;font-weight:800;color:var(--txt);opacity:0;transition:all .28s cubic-bezier(.34,1.56,.64,1);z-index:9998;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);pointer-events:none;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.ms{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.7);background:linear-gradient(135deg,#0a3a68,#1a6fb5);border:3px solid var(--y);border-radius:20px;padding:24px 30px;text-align:center;z-index:9999;opacity:0;transition:all .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none;box-shadow:0 20px 60px rgba(0,0,0,.7);min-width:230px}
.ms.show{opacity:1;transform:translate(-50%,-50%) scale(1);pointer-events:all}
.ms-em{font-size:3rem;margin-bottom:8px}
.ms-ti{font-family:'Boogaloo',cursive;font-size:1.6rem;color:var(--y)}
.ms-su{font-size:.82rem;color:rgba(255,255,255,.85);margin-top:4px;font-weight:700}
.ms-btn{margin-top:16px;background:var(--y);color:#111;border:none;border-radius:99px;padding:9px 24px;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:900;cursor:pointer}

/* ── INFO DRAWER ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;opacity:0;pointer-events:none;transition:opacity .25s}
.overlay.show{opacity:1;pointer-events:all}
.drawer{position:fixed;bottom:0;left:0;right:0;background:var(--drawer);border-radius:20px 20px 0 0;border-top:3px solid var(--y);padding:0;z-index:201;transform:translateY(100%);transition:transform .35s cubic-bezier(.34,1.56,.64,1);max-height:85vh;overflow-y:auto}
.drawer.show{transform:translateY(0)}
.drawer-handle{width:40px;height:4px;background:rgba(255,255,255,.2);border-radius:99px;margin:12px auto 0}
.drawer-img-wrap{padding:16px 20px 8px;display:flex;justify-content:center;background:rgba(0,0,0,.2)}
.drawer-img{max-height:90px;max-width:260px;object-fit:contain;border-radius:6px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.5))}
.drawer-body{padding:16px 20px 32px}
.drawer-name{font-family:'Boogaloo',cursive;font-size:1.5rem;color:var(--y);margin-bottom:4px;line-height:1.1}
.drawer-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.drawer-rar{font-size:.6rem;font-weight:900;letter-spacing:.3px;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.drawer-pts{font-size:.7rem;font-weight:800;color:var(--y)}
.drawer-year{font-size:.65rem;font-family:'Nunito',monospace;color:var(--mut)}
.drawer-vehicles{font-size:.65rem;color:var(--mut)}
.info-section{margin-bottom:14px}
.info-label{font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--mut);margin-bottom:4px}
.info-text{font-size:.88rem;line-height:1.65;color:var(--txt)}
.fact-box{background:rgba(245,197,24,.08);border:1px solid rgba(245,197,24,.2);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.fact-label{font-size:.6rem;font-weight:900;text-transform:uppercase;letter-spacing:1.5px;color:var(--y);margin-bottom:5px}
.fact-text{font-size:.88rem;line-height:1.65;color:var(--txt)}
.drawer-collect-btn{width:100%;padding:13px;background:var(--g);border:none;border-radius:12px;font-family:'Nunito',sans-serif;font-size:1rem;font-weight:900;color:#fff;cursor:pointer;transition:background .15s;margin-top:4px}
.drawer-collect-btn.found-btn{background:rgba(45,179,122,.2);border:2px solid var(--g);color:var(--g)}
.drawer-collect-btn:active{transform:scale(.97)}
</style>
</head>

<script>
const PLATES=[{"id":"af","name":"US Air Force","cat":"military","rar":"rare","pts":50,"img":"airforcePlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~2,800","fact":"The Air Force plate was part of a wave of six Armed Forces plates released in September 1996 \u2014 the same month the first specialty plates rolled off the digital printer at the Walla Walla Penitentiary."},{"id":"army","name":"US Army","cat":"military","rar":"uncommon","pts":25,"img":"armyPlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~7,700","fact":"The most popular of Washington's six Armed Forces plates with about 7,700 registered vehicles \u2014 ranking 7th overall among all specialty plates statewide. Eligibility requires being a veteran, active duty, reservist, National Guard member, or family of one."},{"id":"cg","name":"US Coast Guard","cat":"military","rar":"rare","pts":50,"img":"coastguardPlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~600","fact":"Washington has more miles of coastline than any other contiguous US state \u2014 over 3,000 miles when all the inlets and islands are counted. The Coast Guard operates 3 sectors and 21 stations across Washington waters."},{"id":"mc","name":"US Marine Corps","cat":"military","rar":"rare","pts":50,"img":"marinesPlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~1,200","fact":"Joint Base Lewis-McChord near Tacoma is one of the largest military installations in the US, home to both Army and Marine Corps units. Washington has one of the highest per-capita veteran populations of any state."},{"id":"ng","name":"WA National Guard","cat":"military","rar":"rare","pts":50,"img":"NationalGuardPlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~900","fact":"The Washington National Guard was activated during the 1980 eruption of Mount St. Helens, conducting search and rescue operations across a devastated zone stretching 230 square miles. They've been called up for every major Washington disaster since."},{"id":"navy","name":"US Navy","cat":"military","rar":"rare","pts":50,"img":"navyPlate.png","year":"1996","supports":"State Veterans Cemetery Operations & veterans programs","vehicles":"~2,100","fact":"Naval Station Everett and Naval Base Kitsap make Washington one of the most important Navy states in the nation. Puget Sound's sheltered deep water made it a strategic Navy hub going back to the Civil War era."},{"id":"dav","name":"Disabled American Veteran","cat":"veterans","rar":"rare","pts":50,"img":"disabledVetPlate.png","year":"1996","supports":"Veterans programs & services","vehicles":"~1,500","fact":"Unlike most specialty plates, the Disabled American Veteran plate comes with a significant benefit: it waives certain vehicle licensing fees for qualified disabled veterans. Washington has over 500,000 veterans \u2014 about 6.5% of the state's adult population."},{"id":"pow","name":"Former Prisoner of War","cat":"veterans","rar":"legendary","pts":200,"img":"formerPOWplate.png","year":"1996","supports":"Recognition of POW/MIA service","vehicles":"Under 200","fact":"One of the most restricted plates in Washington \u2014 eligibility requires documented status as a former prisoner of war. As the WWII and Korean War generation ages, this plate becomes increasingly rare. A genuine piece of living history on the road."},{"id":"gs","name":"Gold Star Family","cat":"veterans","rar":"rare","pts":50,"img":"goldstarPlate.png","year":"2000","supports":"Recognition of Gold Star families","vehicles":"~400","fact":"The Gold Star designation dates to WWI, when families displayed a gold star in their window for each member serving. A blue star meant serving; gold meant fallen. This plate is available to family members of service members who died in the line of duty."},{"id":"moh","name":"Medal of Honor","cat":"veterans","rar":"legendary","pts":300,"img":"MOHplate.png","year":"1996","supports":"Recognition of Medal of Honor recipients","vehicles":"Under 50","fact":"The Medal of Honor is the nation's highest military honor. As of 2025, there are fewer than 70 living Medal of Honor recipients in the entire United States. Washington has produced several recipients, including those from the Pacific Theater of WWII."},{"id":"mars","name":"Military Affiliate Radio","cat":"veterans","rar":"legendary","pts":150,"img":"MARSplate.png","year":"1993","supports":"Military Affiliate Radio System operators","vehicles":"Under 300","fact":"MARS \u2014 the Military Affiliate Radio System \u2014 is a DoD program using amateur radio operators to provide communication support for the military. One of the original 1993 specialty plates, approved the same year as the Square Dancer. Ham radio meets military service."},{"id":"ph","name":"Purple Heart","cat":"veterans","rar":"rare","pts":50,"img":"purpleheartPlate.png","year":"1993","supports":"Recognition of combat-wounded veterans","vehicles":"~800","fact":"The Purple Heart is awarded to military members wounded or killed in combat. It's America's oldest military decoration, established by George Washington in 1782 as the Badge of Military Merit. Washington state has one of the highest concentrations of Purple Heart recipients per capita."},{"id":"v988","name":"988 Prevent Veteran Suicide","cat":"veterans","rar":"rare","pts":50,"img":"lifeline-plate.png","year":"2022","supports":"988 Lifeline veteran suicide prevention","vehicles":"~500","fact":"Veterans die by suicide at 1.5x the rate of non-veteran adults. The 988 Lifeline (press 1 for veterans) connects callers directly to VA-trained counselors. This plate carries that number directly on the road \u2014 a moving reminder of the crisis and the resource."},{"id":"orca","name":"Endangered Wildlife \u2013 Orca","cat":"nature","rar":"uncommon","pts":25,"img":"orcaPlate.jpg","year":"1996","supports":"WA Dept. of Fish & Wildlife orca recovery","vehicles":"~4,200","fact":"Washington's Southern Resident Killer Whales are critically endangered \u2014 only about 73 remain as of 2025. They are a distinct population that speaks a different 'dialect' from other orca groups and has never successfully interbred with transient orcas. The $28 annual fee from this plate goes directly to their recovery."},{"id":"hb","name":"Honeybees & Pollinators","cat":"nature","rar":"rare","pts":50,"img":"honeybees-pollinators-plate.png","year":"2025","supports":"WA State Beekeepers Association research & education","vehicles":"New in 2025","fact":"Washington is one of the top honey-producing states in the nation and the nation's largest apple producer \u2014 a crop that depends entirely on pollinator activity. The state has lost an estimated 30% of managed honeybee colonies in the past decade to colony collapse disorder."},{"id":"lt","name":"Lighthouses","cat":"nature","rar":"rare","pts":50,"img":"lighthousePlate.png","year":"1996","supports":"Washington lighthouse preservation","vehicles":"~1,100","fact":"Washington has 28 historic lighthouses, more than almost any other state. The oldest, the New Dungeness Lighthouse on the Olympic Peninsula, has been continuously operated since 1857. It's one of the few lighthouses in the US still staffed by volunteer keepers who live on-site for week-long rotations."},{"id":"sji","name":"San Juan Islands","cat":"nature","rar":"uncommon","pts":25,"img":"SanJuanIslandsPlate.png","year":"2003","supports":"San Juan Islands conservation","vehicles":"~3,500","fact":"The San Juan Islands archipelago contains 172 named islands and hundreds of smaller rocks and reefs. The boundary between the US and Canada runs through the middle of the archipelago \u2014 a line drawn after the 'Pig War' of 1859, the only 'war' in US history with a single casualty: a pig."},{"id":"sf","name":"State Flower","cat":"nature","rar":"rare","pts":50,"img":"StateFlowerPlate.png","year":"2001","supports":"WA Dept. of Fish & Wildlife","vehicles":"~1,800","fact":"Washington's state flower is the Coast Rhododendron (Rhododendron macrophyllum), designated in 1892 \u2014 before Washington had even been a state for 3 years. It blooms in pink and purple clusters across the Olympic Peninsula and Cascade foothills each spring."},{"id":"wac","name":"Washington Apple Commission","cat":"nature","rar":"rare","pts":50,"img":"WashingtonApplesPlate.jpg","year":"2020","supports":"Washington Apple Commission","vehicles":"~1,200","fact":"Washington produces about 60% of all apples grown in the United States \u2014 roughly 10 billion apples per year. The apple capital is Wenatchee in Chelan County. The first apple trees in Washington were planted by Hudson's Bay Company at Fort Vancouver in 1826."},{"id":"np","name":"Washington National Parks","cat":"nature","rar":"common","pts":10,"img":"NationalParksPlate.jpg","year":"1996","supports":"Washington's National Park Fund","vehicles":"~12,700","fact":"Washington has 3 national parks \u2014 Olympic, Mount Rainier, and North Cascades \u2014 plus a fourth that straddles the Canadian border, North Cascades/BC Parks. Mount Rainier at 14,411 feet is the most glaciated peak in the contiguous US, with 26 named glaciers."},{"id":"stp","name":"Washington State Parks","cat":"nature","rar":"uncommon","pts":25,"img":"StateParksPlate.jpg","year":"1996","supports":"WA State Parks and Recreation Commission","vehicles":"~6,200","fact":"Washington has 125 state parks covering over 120,000 acres. Deception Pass State Park is the most visited, with over 2 million visitors per year \u2014 more than Yellowstone. The 180-foot bridge over Deception Pass is one of the most photographed spots in the state."},{"id":"bear","name":"Wildlife \u2013 Bear","cat":"nature","rar":"rare","pts":50,"img":"bearPlate.jpg","year":"1996","supports":"WA Dept. of Fish & Wildlife","vehicles":"~1,600","fact":"Washington has an estimated 25,000\u201330,000 black bears \u2014 one of the largest populations in the contiguous US. The Cascades are particularly dense with bear activity. Despite their name, black bears in Washington frequently appear brown, cinnamon, or even blond."},{"id":"deer","name":"Wildlife \u2013 Deer","cat":"nature","rar":"rare","pts":50,"img":"deerPlate.jpg","year":"1996","supports":"WA Dept. of Fish & Wildlife","vehicles":"~1,900","fact":"Washington has two native deer species: the black-tailed deer west of the Cascades and the mule deer to the east. The Columbia white-tailed deer, found along the Columbia River, was once nearly extinct \u2014 now protected and slowly recovering thanks to refuges near Cathlamet."},{"id":"elk","name":"Wildlife \u2013 Elk","cat":"nature","rar":"rare","pts":50,"img":"elkPlate.jpg","year":"1996","supports":"WA Dept. of Fish & Wildlife","vehicles":"~2,100","fact":"Washington's Olympic Peninsula hosts the Roosevelt elk \u2014 the largest elk subspecies in North America. Olympic National Park was actually established in 1938 partly to protect this herd. Some bulls weigh over 1,000 pounds and carry antlers spanning 5 feet."},{"id":"steel","name":"Wildlife \u2013 Steelhead","cat":"nature","rar":"rare","pts":50,"img":"SteelheadPlate.png","year":"1996","supports":"WA Dept. of Fish & Wildlife","vehicles":"~1,400","fact":"The steelhead is actually a rainbow trout that migrates to the ocean and back \u2014 making it technically the same species as a rainbow trout, just with a radically different life history. Washington's steelhead runs are iconic but critically imperiled by dams, particularly on the Snake River."},{"id":"eagle","name":"Wild on Washington \u2013 Eagle","cat":"nature","rar":"uncommon","pts":25,"img":"eaglePlate.jpg","year":"1996","supports":"WA Dept. of Fish & Wildlife","vehicles":"~4,800","fact":"Washington has one of the highest concentrations of bald eagles in the contiguous US. The Skagit River delta in winter hosts hundreds of eagles feeding on spawned-out salmon \u2014 one of the great wildlife spectacles in the Pacific Northwest. The bald eagle was removed from the endangered species list in 2007."},{"id":"kwe","name":"Keep WA Evergreen","cat":"nature","rar":"rare","pts":50,"img":"keep-wa-evergreen-plate.png","year":"2025","supports":"Electric vehicle charging station expansion","vehicles":"New in 2025","fact":"The green-on-white design is a deliberate throwback to Washington's standard plates from 1968\u20131986 \u2014 18 years when every car in the state wore this color scheme. The retro design is doubly 'green': honoring the state's Evergreen identity while funding EV infrastructure."},{"id":"smb","name":"Smokey Bear","cat":"nature","rar":"rare","pts":50,"img":"smokey-bear-plate.png","year":"2025","supports":"WA Dept. of Natural Resources wildfire prevention","vehicles":"New in 2025","fact":"Smokey Bear turns 81 in 2025. The real Smokey was a black bear cub rescued from a 1950 New Mexico wildfire, his paws burned. He lived at the National Zoo until 1976. Oregon's Smokey Bear plate \u2014 launched in 2019 \u2014 became one of the most popular specialty plates in that state's history with over 90,000 registered."},{"id":"msh","name":"Mount St. Helens","cat":"nature","rar":"rare","pts":50,"img":"mount-st-helens-license-plate-scaled.png","year":"2025","supports":"Mount St. Helens education & stewardship","vehicles":"New in 2025","fact":"Mount St. Helens erupted on May 18, 1980, in the deadliest and most economically destructive volcanic event in US history. The eruption removed 1,314 feet from the summit and blasted 230 square miles of forest flat. This plate's first design failed DOL readability testing \u2014 a fitting nod to a mountain that refuses to be tamed."},{"id":"hawks","name":"Seattle Seahawks","cat":"sports","rar":"common","pts":10,"img":"seahawksPlate.png","year":"2001","supports":"Seattle Seahawks Charitable Foundation","vehicles":"~11,100","fact":"The Seahawks plate ranks 5th overall among all Washington specialty plates, with about 11,100 registered vehicles generating over $336,000 annually. The throwback design celebrates the team's 50th season with the original royal blue, apple green, and silver helmet colors from the 1976 expansion year."},{"id":"mar","name":"Seattle Mariners","cat":"sports","rar":"uncommon","pts":25,"img":"marinersPlate.png","year":"1997","supports":"Originally funded Safeco Field construction bonds","vehicles":"~1,100","fact":"The Mariners plate was created in 1997 specifically to help fund construction of what is now T-Mobile Park. It's the lowest-registered sports team plate in Washington \u2014 just 1,100 vehicles \u2014 despite the Mariners being one of the city's most beloved franchises. Maybe fans spend their money on tickets instead."},{"id":"krak","name":"Seattle Kraken","cat":"sports","rar":"uncommon","pts":25,"img":"kraken-plate.png","year":"2021","supports":"Climate Pledge Arena & Kraken Community Iceplex","vehicles":"~3,200","fact":"Seattle's NHL team, the Kraken, chose their name after the legendary sea monster of Norse mythology \u2014 a fitting choice for a city built on Puget Sound. They played their first NHL game in 2021 and are the 32nd franchise in NHL history. Their home, Climate Pledge Arena, is the first carbon-neutral arena in the world."},{"id":"sound","name":"Seattle Sounders FC","cat":"sports","rar":"uncommon","pts":25,"img":"soundersPlate.png","year":"2009","supports":"Sounders FC community programs","vehicles":"~3,800","fact":"The Sounders have the highest average attendance of any MLS team, regularly selling out 69,000-seat Lumen Field \u2014 an arena built for the NFL. Their supporters' groups, including the Emerald City Supporters, are among the most passionate in North American soccer. They've won MLS Cup twice, in 2016 and 2019."},{"id":"storm","name":"Seattle Storm","cat":"sports","rar":"rare","pts":50,"img":"stormPlate.png","year":"2001","supports":"Seattle Storm community programs","vehicles":"~1,800","fact":"The Seattle Storm are one of the most successful franchises in WNBA history with 4 championships (2004, 2010, 2018, 2020). Sue Bird, who played her entire 21-year career in Seattle, is widely considered the greatest WNBA player of all time. The Storm have a notoriously passionate fanbase."},{"id":"ski","name":"Ski and Ride","cat":"sports","rar":"rare","pts":50,"img":"skiPlate.jpg","year":"1996","supports":"Washington ski area infrastructure","vehicles":"~2,200","fact":"Washington has 20+ ski areas, with Crystal Mountain near Mount Rainier being the largest. The state gets some of the heaviest snowfall in North America at higher elevations \u2014 Mount Baker Ski Area holds the world record for snowfall in a single season: 1,140 inches (95 feet) in 1998\u201399."},{"id":"pkl","name":"State Sport: Pickleball","cat":"sports","rar":"rare","pts":50,"img":"pickleball-plate.png","year":"2025","supports":"Seattle Metro Pickleball Association court construction","vehicles":"New in 2025","fact":"Pickleball was invented on Bainbridge Island, Washington in 1965 by Joel Pritchard (later a US Congressman), Bill Bell, and Barney McCallum. They created it with ping-pong paddles and a perforated plastic ball on a badminton court. Washington designated it the official state sport in 2022 \u2014 making this the first state sport license plate in the nation."},{"id":"tennis","name":"Tennis","cat":"sports","rar":"legendary","pts":150,"img":"TennisPlate.png","year":"2022","supports":"New public indoor tennis facility construction","vehicles":"~19","fact":"With only about 19 registered plates statewide, Tennis is one of Washington's most obscure specialty plates. It funds construction of new public indoor tennis facilities. Washington has produced notable tennis talent \u2014 including a strong tradition at the University of Washington \u2014 but the plate hasn't caught on with the broader public."},{"id":"wrest","name":"Wrestling","cat":"sports","rar":"legendary","pts":150,"img":"WrestlingPlate.png","year":"2022","supports":"Washington State Wrestling Foundation","vehicles":"~112","fact":"Wrestling is one of Washington's most successful high school and collegiate sports, with multiple state championship programs. Yet only about 112 vehicles carry this plate. Washington wrestlers have won Olympic and NCAA titles \u2014 but apparently prefer not to advertise it on their bumper."},{"id":"wsu","name":"Washington State University","cat":"colleges","rar":"common","pts":10,"img":"WSUplate.png","year":"1995","supports":"WSU scholarship funds","vehicles":"~24,100","fact":"WSU is by far the most popular specialty plate in Washington, with 24,100 registered vehicles generating $734,000 annually \u2014 nearly twice its nearest competitor. Founded in 1890 as the state's land-grant university, WSU's Pullman campus sits in the rolling Palouse wheat country of eastern Washington."},{"id":"uw","name":"University of Washington","cat":"colleges","rar":"common","pts":10,"img":"UWplate.png","year":"1995","supports":"UW scholarship funds","vehicles":"~10,300","fact":"The UW ranks 6th overall among Washington specialty plates. Founded in 1861 \u2014 before Washington was even a state \u2014 it's one of the oldest universities on the West Coast. The purple and gold plate features the block W that has been the Husky symbol since 1923. UW's medical school consistently ranks among the top 5 in the nation."},{"id":"cwu","name":"Central Washington University","cat":"colleges","rar":"uncommon","pts":25,"img":"CWUplate.png","year":"1996","supports":"CWU scholarship funds","vehicles":"~2,800","fact":"Central Washington University in Ellensburg sits at the convergence of the Cascades and the Columbia Plateau. Founded in 1891, CWU is known for its aviation program \u2014 one of the best in the Northwest \u2014 and its primate research center, where chimpanzees have been taught American Sign Language since the 1970s."},{"id":"ewu","name":"Eastern Washington University","cat":"colleges","rar":"uncommon","pts":25,"img":"EWUplate.png","year":"1996","supports":"EWU scholarship funds","vehicles":"~2,400","fact":"Eastern Washington University in Cheney (near Spokane) has one of the most dominant FCS football programs in the country \u2014 the Eagles have won multiple national championships and regularly appear in the playoffs. The school's red-and-white colors make the plate one of the more distinctive in the college series."},{"id":"esc","name":"The Evergreen State College","cat":"colleges","rar":"rare","pts":50,"img":"TESCplate.png","year":"1997","supports":"Evergreen State scholarship funds","vehicles":"~1,200","fact":"Evergreen State College in Olympia was founded in 1967 with a radically experimental model: no majors, no grades, no traditional departments. Students design their own curriculum in interdisciplinary programs. Notable alumni include Matt Groening (creator of The Simpsons) and Macklemore."},{"id":"gonz","name":"Gonzaga University","cat":"colleges","rar":"uncommon","pts":25,"img":"gonzagaPlate.png","year":"1996","supports":"Gonzaga scholarship funds","vehicles":"~3,100","fact":"Gonzaga University in Spokane is nationally known for its men's basketball program \u2014 the Bulldogs have made 27 consecutive NCAA Tournament appearances. The school was founded by Jesuits in 1887 on the banks of the Spokane River. Notable alumni include Bing Crosby, who was actually expelled before graduating."},{"id":"seu","name":"Seattle University","cat":"colleges","rar":"rare","pts":50,"img":"seattle-univ-plate.png","year":"1996","supports":"Seattle University scholarship funds","vehicles":"~200","fact":"Seattle University is the least-purchased college plate in Washington, with only about 200 registered vehicles \u2014 generating just $6,600 annually. The Jesuit university on Capitol Hill was founded in 1891 and is known for its law school and nursing program. Despite its small plate numbers, it has a fiercely loyal alumni base."},{"id":"wwu","name":"Western Washington University","cat":"colleges","rar":"uncommon","pts":25,"img":"WWUplate.png","year":"1996","supports":"WWU scholarship funds","vehicles":"~3,600","fact":"Western Washington University in Bellingham sits between the North Cascades and Puget Sound, with a view of the San Juan Islands on clear days. Founded in 1893, WWU is known for its Huxley College of the Environment \u2014 one of the oldest and most respected environmental studies programs in the US."},{"id":"lem","name":"Law Enforcement Memorial","cat":"firstresponder","rar":"common","pts":10,"img":"LEMplate.png","year":"1996","supports":"Behind the Badge Foundation","vehicles":"~11,300","fact":"The Law Enforcement Memorial plate ranks 4th overall in Washington, with 11,300 registered vehicles \u2014 and uniquely, any Washington driver can purchase it regardless of profession. The $28 annual fee supports the Behind the Badge Foundation, which provides assistance to families of fallen officers."},{"id":"pff","name":"Professional Firefighter","cat":"firstresponder","rar":"uncommon","pts":25,"img":"firefighterPlate.png","year":"1996","supports":"WA State Council of Firefighters","vehicles":"~4,800","fact":"Washington's professional firefighter plate requires proof of membership \u2014 you must be a current member of the Washington State Council of Firefighters. Washington has over 300 fire departments protecting communities from the rainy coast to the fire-prone east side. The firefighter tradition in the state goes back to the Great Seattle Fire of 1889."},{"id":"vff","name":"Volunteer Firefighter","cat":"firstresponder","rar":"rare","pts":50,"img":"VolunteerFirefighterPlate.png","year":"2000","supports":"WA State Council of Firefighters","vehicles":"~1,600","fact":"About 70% of fire departments in Washington are staffed entirely or primarily by volunteers. Rural eastern Washington communities depend almost entirely on volunteer firefighters. The volunteer firefighter plate was approved for release in January 2000 \u2014 six years after it was first authorized by the legislature."},{"id":"4h","name":"4-H","cat":"charity","rar":"uncommon","pts":25,"img":"4Hplate.png","year":"2001","supports":"4-H youth development programs","vehicles":"~2,600","fact":"4-H is America's largest youth development organization, with over 6 million members. The four H's stand for Head, Heart, Hands, and Health. In Washington, 4-H has deep roots in agricultural counties east of the Cascades, where county fairs featuring 4-H livestock competitions are major community events."},{"id":"bca","name":"Breast Cancer Awareness","cat":"charity","rar":"uncommon","pts":25,"img":"Breast-cancer-plate.png","year":"2001","supports":"Breast cancer research and awareness","vehicles":"~3,200","fact":"Washington is home to Fred Hutchinson Cancer Center in Seattle, one of the world's leading cancer research institutions. The pink ribbon on this plate has been a universal symbol of breast cancer awareness since 1991. Washington women have a slightly higher breast cancer incidence rate than the national average."},{"id":"ffa","name":"FFA Foundation","cat":"charity","rar":"rare","pts":50,"img":"FFAplate.png","year":"2001","supports":"National FFA Organization Washington chapter","vehicles":"~1,800","fact":"FFA (formerly Future Farmers of America) has been preparing young people for careers in agriculture since 1928. Washington's agricultural sector generates over $10 billion annually \u2014 apples, wheat, hops, dairy, and wine grapes are the top commodities. FFA chapters are strongest in eastern Washington's agricultural heartland."},{"id":"fh","name":"Fred Hutchinson Cancer Ctr.","cat":"charity","rar":"rare","pts":50,"img":"fredhutchplate.png","year":"2006","supports":"Fred Hutchinson Cancer Center research","vehicles":"~1,400","fact":"Fred Hutchinson Cancer Center in Seattle is where bone marrow transplantation was developed \u2014 a breakthrough that has saved millions of lives worldwide. It's named for Seattle-raised pitcher Fred Hutchinson, who died of lung cancer in 1964. Three Nobel Prizes in Medicine have been awarded for work done at the Hutch."},{"id":"hks","name":"Helping Kids Speak","cat":"charity","rar":"rare","pts":50,"img":"HelpingKidsSpeakPlate.png","year":"2009","supports":"Speech and language programs for children","vehicles":"~900","fact":"Communication disorders affect 1 in 12 children in the US. Washington's Helping Kids Speak plate funds speech-language therapy for children who might otherwise lack access. Early intervention in speech disorders before age 5 dramatically improves long-term outcomes."},{"id":"jpp","name":"J.P. Patches Pal","cat":"charity","rar":"legendary","pts":200,"img":"patches-pal-plate.png","year":"2022","supports":"Seattle Children's Hospital cancer research","vehicles":"Under 500","fact":"The J.P. Patches Show ran on KIRO-TV from 1958 to 1981 \u2014 over 10,000 episodes, making it one of the longest-running locally produced children's shows in US history. The man behind the clown, Chris Wedes of Edmonds, died in 2012. His fans included Bill Gates, Paul Allen, and generations of Seattle kids. It took three tries to get the plate approved by the legislature."},{"id":"kks","name":"Keep Kids Safe","cat":"charity","rar":"uncommon","pts":25,"img":"KeepKidsSafePlate.png","year":"2006","supports":"Strengthening Families Washington","vehicles":"~3,800","fact":"Issued January 3, 2006, the Keep Kids Safe plate supports Strengthening Families Washington, which works to prevent child abuse and neglect. The handprint design on the plate was created from actual children's handprints. Washington has invested significantly in early childhood programs including the nationally-recognized Early Achievers quality rating system."},{"id":"wine","name":"Washington Wine Commission","cat":"charity","rar":"rare","pts":50,"img":"wine-country-plate.png","year":"2022","supports":"Washington Wine Commission promotion & research","vehicles":"~1,200","fact":"Washington is the second-largest wine producer in the US after California, with over 1,000 wineries and 60,000+ acres of wine grapes. The Columbia Valley AVA east of the Cascades gets 300 days of sunshine per year \u2014 more than Napa Valley. Walla Walla and the Yakima Valley are the most celebrated wine regions."},{"id":"pets","name":"We Love Our Pets","cat":"charity","rar":"uncommon","pts":25,"img":"petsPlate.png","year":"1996","supports":"WA Federation of Animal Care & Control Agencies","vehicles":"~4,100","fact":"Washington has some of the most progressive animal welfare laws in the country. The We Love Our Pets plate funds spay/neuter programs statewide \u2014 reducing pet overpopulation and euthanasia rates. Seattle and King County have achieved 'no-kill' status, meaning over 90% of shelter animals are adopted or transferred."},{"id":"ham","name":"Amateur Radio (HAM)","cat":"hobby","rar":"rare","pts":50,"img":"HAMplate.png","year":"1996","supports":"Amateur radio operator recognition","vehicles":"~1,300","fact":"The HAM radio plate uses the operator's actual FCC call sign as the plate number \u2014 making every plate unique and instantly recognizable to other operators. Washington has a strong amateur radio tradition, partly due to its rugged terrain making radio essential for emergency communications during earthquakes, volcanic eruptions, and wildfires."},{"id":"fly","name":"Fly Washington Aviation","cat":"hobby","rar":"rare","pts":50,"img":"AviationPlate.png","year":"1996","supports":"Washington aviation education & infrastructure","vehicles":"~1,600","fact":"Washington is the birthplace of Boeing \u2014 the largest aerospace company in the world. The first Boeing airplane flew in 1916. Washington has over 130 public-use airports, more per capita than most states. The Fly Washington plate helps fund rural airport maintenance and aviation education programs."},{"id":"mm","name":"Music Matters","cat":"hobby","rar":"rare","pts":50,"img":"musicPlate.png","year":"2000","supports":"Music Aid Northwest","vehicles":"~1,100","fact":"Seattle's music scene produced Jimi Hendrix, Nirvana, Pearl Jam, Soundgarden, and Macklemore \u2014 a disproportionate influence on rock history for one mid-sized city. Music Aid Northwest, supported by this plate, provides instruments and music education to underserved students across Washington."},{"id":"str","name":"Share the Road","cat":"hobby","rar":"rare","pts":50,"img":"ShareRoadPlate.png","year":"1996","supports":"Bicycle infrastructure and safety","vehicles":"~1,900","fact":"The Share the Road plate features a cyclist and was part of the original 1996 specialty plate launch. Washington has invested heavily in bike infrastructure \u2014 the Burke-Gilman Trail in Seattle is one of the most used multi-use trails in the US. The state has over 3,000 miles of designated bicycle routes."},{"id":"sq","name":"Square Dancer","cat":"hobby","rar":"legendary","pts":300,"img":"squaredancePlate.png","year":"1993","supports":"No beneficiary \u2014 celebration of state dance","vehicles":"5","fact":"The Square Dancer was Washington's very first specialty license plate, debuting in 1993 \u2014 and for a few years, it was the ONLY specialty plate in the state. Square dancing was designated Washington's official state dance in 1979. At its peak, around 664 of these plates were registered. Today only 5 remain. It's the rarest plate on Washington roads."},{"id":"tbk","name":"Throwback Blackout","cat":"hobby","rar":"rare","pts":50,"img":"throwback-plate.png","year":"2025","supports":"Driver education programs","vehicles":"New in 2025","fact":"The black-on-white design references Washington's 1917\u201318 plate \u2014 the only time in state history a true blackout plate was issued. 'Blackout' plates have become enormously popular nationally, with states like California and Colorado seeing massive demand for similar designs. Washington's version was one of six new plates approved in the landmark 2025 omnibus plate bill."},{"id":"lemay","name":"LeMay Car Museum","cat":"hobby","rar":"rare","pts":50,"img":"lemay-plate.png","year":"2025","supports":"LeMay \u2014 America's Car Museum education programs","vehicles":"New in 2025","fact":"LeMay \u2014 America's Car Museum in Tacoma is named for Harold LeMay of Spanaway, who assembled what was recognized as the world's largest private automobile collection before his death \u2014 over 3,000 vehicles. The museum, which opened in 2012, is housed in a striking building near I-5 designed by internationally renowned architect Antoine Predock."},{"id":"col","name":"Collector Vehicle","cat":"vehicle","rar":"common","pts":10,"img":"collectorPlate.png","year":"1993","supports":"No beneficiary","vehicles":"~20,300","fact":"The Collector Vehicle plate is Washington's second most popular specialty plate, with 20,300 registered vehicles generating $710,400 annually. Eligible vehicles must be at least 30 years old and cannot be used for regular transportation like commuting. These are weekend show cars and parade vehicles only."},{"id":"hc","name":"Horseless Carriage","cat":"vehicle","rar":"legendary","pts":300,"img":"HorselessCarriagePlate.png","year":"1993","supports":"No beneficiary","vehicles":"~140","fact":"To qualify for the Horseless Carriage plate, your vehicle must have been built before January 1, 1916 \u2014 making it over 110 years old. Washington's first motor vehicle law was passed in 1905 when there were 1,253 cars in the entire state. The owner of the first licensed vehicle, Mr. S.A. Perkins of Tacoma, drove a 30 HP Pope-Toledo Touring Car."},{"id":"rest","name":"Restored Vehicle","cat":"vehicle","rar":"rare","pts":50,"img":"restoredPlate.jpg","year":"2001","supports":"No beneficiary","vehicles":"~1,800","fact":"The Restored Vehicle plate is for vehicles that have been authentically restored to original factory specifications \u2014 distinct from the Collector Vehicle plate which is for any old car. Washington's car restoration community is particularly active around the Puget Sound region, with several major shows and clubs."},{"id":"rs","name":"Rideshare / Vanpool","cat":"vehicle","rar":"rare","pts":50,"img":"ridesharePlate.png","year":"1996","supports":"Commuter vanpool programs","vehicles":"~1,200","fact":"Washington's Rideshare plate is specifically for vanpool vehicles carrying 3+ commuters \u2014 and it comes with a potential sales tax exemption. The state has one of the most active vanpool programs in the nation, with WSDOT subsidizing shared commuter vans to reduce traffic on major corridors like I-5 and SR-520."},{"id":"cheh","name":"Chehalis Tribe","cat":"tribal","rar":"legendary","pts":200,"img":"chehalis-tribe-plate.png","year":"2009","supports":"Chehalis Tribe government programs","vehicles":"Under 500","fact":"The Chehalis Tribe (Confederated Tribes of the Chehalis Reservation) has lived along the Chehalis River in southwest Washington since time immemorial. Their reservation near Oakville was established in 1864. The tribe operates the Great Wolf Lodge resort and Talking Cedar Casino, which fund tribal government and social services."},{"id":"muck","name":"Muckleshoot Tribe","cat":"tribal","rar":"legendary","pts":200,"img":"muckleshoot-tribe-plate.png","year":"2009","supports":"Muckleshoot Tribe government programs","vehicles":"Under 500","fact":"The Muckleshoot Tribe lives on a reservation southeast of Auburn, between the White and Green Rivers. They are one of the most culturally active tribes in Washington, maintaining traditional salmon fishing rights on the White River. The tribe operates Muckleshoot Casino and has invested heavily in tribal education, housing, and cultural preservation."},{"id":"puy","name":"Puyallup Tribe","cat":"tribal","rar":"legendary","pts":200,"img":"puyallup-tribe-plate.png","year":"2009","supports":"Puyallup Tribe government programs","vehicles":"Under 500","fact":"The Puyallup Tribe is one of the largest tribes in Washington with over 5,000 enrolled members. Their reservation near Tacoma covers land that was dramatically reduced after an 1854 treaty \u2014 then partially restored through a landmark 1989 settlement. The tribe operates Emerald Queen Casino and has built one of the most comprehensive tribal social service networks in the state."}];
const TOTAL=72;
let found=JSON.parse(localStorage.getItem('ph_wa')||'{}');
let shownMs=JSON.parse(localStorage.getItem('ph_wa_ms')||'[]');
let filter='all';
let drawerPlateId=null;
const MS=[
  {at:1, em:'🚗',ti:'First Plate!',    su:'Your very first Washington plate spotted!'},
  {at:5, em:'👀',ti:'Eyes Open!',       su:"5 plates — you're on a roll!"},
  {at:10,em:'🔍',ti:'Plate Detective',  su:'10 plates! Sharp eyes, hunter!'},
  {at:25,em:'⭐',ti:'Quarter Deck!',    su:'25 plates — one third of the way there!'},
  {at:50,em:'🔥',ti:'Plate Hunter Pro', su:'50 plates! Seriously impressive!'},
  {at:TOTAL,em:'🏆',ti:'COMPLETE!',     su:`ALL ${TOTAL} Washington plates found! LEGENDARY!`},
];

function render(){
  const g=document.getElementById('grid');
  const list=filter==='all'?PLATES:filter==='found'?PLATES.filter(p=>found[p.id]):PLATES.filter(p=>p.cat===filter);
  if(!list.length){
    g.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--mut)"><div style="font-size:3rem;margin-bottom:12px">🔍</div><p style="font-weight:800;line-height:1.6">No plates found yet!<br>Get out and start hunting!</p></div>`;
    return;
  }
  g.innerHTML=list.map(p=>{
    const f=!!found[p.id];
    return `<div class="card${f?' found':''}" data-id="${p.id}">
      <div class="iw" onclick="tap('${p.id}')">
        <img class="plate-img" src="plates/WA/${p.img}" alt="${p.name}" loading="lazy">
        <div class="chk">✓</div>
      </div>
      <div class="info-btn" onclick="event.stopPropagation();openDrawer('${p.id}')">ℹ</div>
      <div class="ci" onclick="openDrawer('${p.id}')">
        <div class="cn">${p.name}</div>
        <div class="cm"><span class="rar r-${p.rar}">${p.rar}</span><span class="pts">+${p.pts}pts</span></div>
      </div></div>`;
  }).join('');
}

function stats(){
  const fc=PLATES.filter(p=>found[p.id]).length;
  const pts=PLATES.filter(p=>found[p.id]).reduce((s,p)=>s+p.pts,0);
  document.getElementById('pCt').textContent=`${fc} / ${TOTAL}`;
  document.getElementById('pFill').style.width=`${(fc/TOTAL)*100}%`;
  document.getElementById('tPts').textContent=pts;
  document.getElementById('lCt').textContent=PLATES.filter(p=>found[p.id]&&p.rar==='legendary').length;
  document.getElementById('rCt').textContent=PLATES.filter(p=>found[p.id]&&p.rar==='rare').length;
  return fc;
}

function tap(id){
  const p=PLATES.find(x=>x.id===id);if(!p)return;
  const was=!!found[id];
  was?delete found[id]:(found[id]=Date.now());
  localStorage.setItem('ph_wa',JSON.stringify(found));
  const card=document.querySelector(`[data-id="${id}"]`);
  if(card){card.classList.toggle('found',!was);card.classList.add('pop');setTimeout(()=>card.classList.remove('pop'),350);}
  if(!was){confetti(card);showToast(p);checkMs(stats());}else stats();
  if(filter==='found')render();
  if(drawerPlateId===id)updateDrawerBtn(id);
}

function tapFromDrawer(){
  if(drawerPlateId)tap(drawerPlateId);
}

function openDrawer(id){
  const p=PLATES.find(x=>x.id===id);if(!p)return;
  drawerPlateId=id;
  document.getElementById('drawerImg').src='plates/WA/'+p.img;
  document.getElementById('drawerImg').alt=p.name;
  document.getElementById('drawerName').textContent=p.name;
  const rarEl=document.getElementById('drawerRar');
  rarEl.textContent=p.rar;
  rarEl.className='drawer-rar r-'+p.rar;
  document.getElementById('drawerPts').textContent='+'+p.pts+' pts';
  document.getElementById('drawerYear').textContent='First issued: '+p.year;
  document.getElementById('drawerVehicles').textContent='🚗 '+p.vehicles+' on WA roads';
  document.getElementById('drawerFact').textContent=p.fact;
  document.getElementById('drawerSupports').textContent=p.supports;
  updateDrawerBtn(id);
  document.getElementById('overlay').classList.add('show');
  document.getElementById('drawer').classList.add('show');
}

function updateDrawerBtn(id){
  const btn=document.getElementById('drawerBtn');
  const f=!!found[id];
  btn.textContent=f?'✓ Found — tap to unmark':'Tap to Mark as Found!';
  btn.className='drawer-collect-btn'+(f?' found-btn':'');
}

function closeDrawer(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('drawer').classList.remove('show');
  drawerPlateId=null;
}

const CC=['#f5c518','#2db37a','#f07d18','#e03c3c','#8b5cf6','#4fc3f7','#ff6eb4'];
function confetti(el){
  if(!el)return;
  const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  const b=document.createElement('div');b.className='burst';b.style.cssText=`left:${cx}px;top:${cy}px`;
  for(let i=0;i<20;i++){
    const bit=document.createElement('div');bit.className='bit';
    const a=(i/20)*360,d=45+Math.random()*60,s=5+Math.random()*6;
    bit.style.cssText=`background:${CC[i%CC.length]};width:${s}px;height:${s}px;--tx:${Math.cos(a*Math.PI/180)*d}px;--ty:${Math.sin(a*Math.PI/180)*d}px;--tr:${Math.random()*360}deg;left:-3px;top:-3px`;
    b.appendChild(bit);
  }
  document.body.appendChild(b);setTimeout(()=>b.remove(),850);
}
let tT;
function showToast(p){
  const t=document.getElementById('toast');
  const m={legendary:`🏆 LEGENDARY! ${p.name} +${p.pts}pts!!`,rare:`🔥 Rare find! ${p.name} +${p.pts}pts`,uncommon:`✨ Nice! ${p.name} +${p.pts}pts`,common:`✓ Spotted! ${p.name} +${p.pts}pts`};
  t.textContent=m[p.rar]||m.common;
  t.style.borderColor=p.rar==='legendary'?'var(--y)':p.rar==='rare'?'var(--o)':'var(--g)';
  t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2600);
}
function checkMs(count){
  const m=MS.find(m=>m.at===count&&!shownMs.includes(m.at));
  if(!m)return;
  shownMs.push(m.at);localStorage.setItem('ph_wa_ms',JSON.stringify(shownMs));
  setTimeout(()=>{document.getElementById('msEm').textContent=m.em;document.getElementById('msTi').textContent=m.ti;document.getElementById('msSu').textContent=m.su;document.getElementById('ms').classList.add('show');},600);
}
function closeMs(){document.getElementById('ms').classList.remove('show');}
document.getElementById('fb').addEventListener('click',e=>{
  const ch=e.target.closest('.ch');if(!ch)return;
  document.querySelectorAll('.ch').forEach(c=>c.classList.remove('on'));
  ch.classList.add('on');filter=ch.dataset.cat;render();
});
render();stats();
</script>
