<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Plate Hunter: the road-trip license plate game</title>
<meta name="description" content="Spot a plate from every state, or hunt down Washington's 72 specialty plates, from the square dancer to the Seahawks. A free road-trip game that works offline. No account, no ads.">
<meta name="theme-color" content="#0a3a68">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plate Hunter">
<meta property="og:title" content="Plate Hunter">
<meta property="og:description" content="The road-trip license plate game: every state, plus Washington's 72 specialty plates, scored by how rare they really are.">
<meta property="og:image" content="https://brooksgroves.com/plate-hunter/icons/og.png">
<meta property="og:url" content="https://brooksgroves.com/plate-hunter/">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="road" aria-hidden="true"></div>
<nav class="bg-bar" aria-label="brooksgroves.com"><a href="https://brooksgroves.com/">&larr; brooksgroves.com</a><a href="https://brooksgroves.com/blog/plate-hunter-post.html">The story</a><a href="https://github.com/bdgroves/plate-hunter">Code</a></nav>
<header>
  <h1 class="title">🔍 PLATE HUNTER</h1>
  <div class="sub">Spot &bull; Tap &bull; Collect</div>
  <div class="tabs">
    <div role="tablist" aria-label="Game" class="tabs">
      <button class="tab" role="tab" data-view="states" aria-selected="true">🗺 States</button>
      <button class="tab" role="tab" data-view="specialty" aria-selected="false">✨ Specialty</button>
    </div>
    <button class="tab about" id="aboutBtn" aria-label="How to play, backups and sources">?</button>
  </div>
</header>
<main id="main"><div class="empty"><b>🚗</b>Warming up the engine…</div></main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="ms" id="ms" role="alertdialog" aria-labelledby="msTi" aria-describedby="msSu">
  <div class="ms-em" id="msEm">🏆</div>
  <div class="ms-ti" id="msTi"></div>
  <div class="ms-su" id="msSu"></div>
  <button class="btn" id="msBtn">Keep hunting!</button>
</div>
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Details">
  <div class="drawer-handle"></div>
  <button class="drawer-x" id="drawerX" aria-label="Close">✕</button>
  <div id="drawerInner"></div>
</div>
<noscript><p style="padding:20px">Plate Hunter needs JavaScript to run.</p></noscript>
<script src="app.js"></script>
</body>
</html>
